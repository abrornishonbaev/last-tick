<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Tick</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--card:#fff;--tx:#222;--ac:#c0392b;--bd:#ddd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}
body[data-ui=dark]{--bg:#16181d;--card:#22252c;--tx:#eee;--ac:#4aa3ff;--bd:#3a3e47}
body[data-ui=neon]{--bg:#0b0221;--card:#1a0b3d;--tx:#f0e6ff;--ac:#ff2bd6;--bd:#5b2bb5}
body[data-ui=sunset]{--bg:#ffe3cf;--card:#fff4ea;--tx:#4a1f0e;--ac:#e8590c;--bd:#f2b48c}
h1{margin:0 0 8px;font-size:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;align-items:flex-end;justify-content:center;height:84px;margin:6px 0;padding:4px;border-radius:10px;cursor:pointer}
.row.sel{outline:2px dashed var(--ac)}
.stick{width:14px;height:70px;border-radius:7px;background:var(--s1);border:2px solid var(--s2);transition:.15s}
.stick.pick{transform:translateY(-8px);box-shadow:0 0 10px var(--ac);border-color:var(--ac)}
body[data-sk=wood]{--s1:#c8924f;--s2:#8a5a24}
body[data-sk=bamboo]{--s1:#9ccc65;--s2:#558b2f}
body[data-sk=neon]{--s1:#2bffe0;--s2:#00a58e}
body[data-sk=gold]{--s1:#ffd54a;--s2:#b8860b}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.45;cursor:default}
.msg{text-align:center;min-height:24px;font-weight:600}
.msg.low{color:var(--ac)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.item.on{border-color:var(--ac)}
.prof{display:flex;gap:10px;align-items:center}
.ava{display:flex;gap:4px;align-items:flex-end;height:40px}
.ava i{width:8px;border-radius:4px;background:var(--s1);border:1px solid var(--s2)}
small{opacity:.7}
.seg{display:flex;gap:6px;margin:4px 0}.seg button{flex:1}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>
<body data-ui="light" data-sk="wood">
<div class="top"><h1>🪵 Last Tick <small>by Qunsight</small></h1><b id="coins"></b></div>
<div class="seg" id="langs"></div>
<small data-i="rules"></small>
<div class="card"><div class="seg" id="modes"></div><div class="seg" id="lvls"></div></div>

<div class="card">
  <div id="board"></div>
  <div class="msg" id="timer"></div>
  <div class="msg" id="msg"></div>
  <div style="display:flex;gap:8px;justify-content:center">
    <button class="pri" id="take" data-i="take"></button>
    <button id="again" data-i="again"></button>
  </div>
</div>

<div class="card">
  <b data-i="card"></b>
  <div class="prof" style="margin-top:8px">
    <div class="ava"><i style="height:14px"></i><i style="height:22px"></i><i style="height:30px"></i><i style="height:38px"></i></div>
    <div><div data-i="player"></div><small id="pstat"></small></div>
  </div>
</div>

<div class="card">
  <b data-i="shopSk"></b><div class="shop" id="shopSk" style="margin-top:8px"></div>
  <b data-i="shopUi" style="display:block;margin-top:12px"></b><div class="shop" id="shopUi" style="margin-top:8px"></div>
</div>

<script>
const L={
ru:{rules:"Забирай от 1 до всех палок из одного ряда. Кто заберёт последнюю палку — проиграл. На ход 30 секунд.",bot:"🤖 Против бота",pvp:"👥 Вдвоём",easy:"Легко",mid:"Средне",hard:"Сложно",take:"Забрать",again:"Новая игра",card:"Твоя карточка в лобби",player:"Игрок",shopSk:"Магазин палок",shopUi:"Магазин интерфейсов",my:"Твой ход",p1:"Ход: Игрок 1",p2:"Ход: Игрок 2",pl1:"Игрок 1",pl2:"Игрок 2",think:"Бот думает…",sel:"Выбрано",pick:"Выбрать",buy:"Купить за {N} 🪙",wins:"Победы",losses:"Поражения",lose:"Ты забрал последнюю — проигрыш. +2 🪙",win:"Бот забрал последнюю — победа! +{N} 🪙",pvpEnd:"{L} забрал последнюю и проиграл. Победил {W}!",sec:"с",sk_wood:"Дерево",sk_bamboo:"Бамбук",sk_neon:"Неон",sk_gold:"Золото",ui_light:"Светлый",ui_dark:"Тёмный",ui_sunset:"Закат",ui_neon:"Неон"},
uz:{rules:"Bitta qatordan 1 tadan hammasigacha tayoqcha ol. Oxirgi tayoqchani olgan yutqazadi. Har bir yurishga 30 soniya.",bot:"🤖 Botga qarshi",pvp:"👥 Ikki kishilik",easy:"Oson",mid:"Oʻrtacha",hard:"Qiyin",take:"Olish",again:"Yangi oʻyin",card:"Lobbidagi kartochkang",player:"Oʻyinchi",shopSk:"Tayoqchalar doʻkoni",shopUi:"Interfeyslar doʻkoni",my:"Sening yurishing",p1:"Yurish: 1-oʻyinchi",p2:"Yurish: 2-oʻyinchi",pl1:"1-oʻyinchi",pl2:"2-oʻyinchi",think:"Bot oʻylayapti…",sel:"Tanlangan",pick:"Tanlash",buy:"{N} 🪙 ga olish",wins:"Gʻalabalar",losses:"Magʻlubiyatlar",lose:"Sen oxirgisini olding — yutqazding. +2 🪙",win:"Bot oxirgisini oldi — gʻalaba! +{N} 🪙",pvpEnd:"{L} oxirgisini olib yutqazdi. {W} gʻalaba qozondi!",sec:"s",sk_wood:"Yogʻoch",sk_bamboo:"Bambuk",sk_neon:"Neon",sk_gold:"Oltin",ui_light:"Yorugʻ",ui_dark:"Qorongʻu",ui_sunset:"Quyosh botishi",ui_neon:"Neon"},
en:{rules:"Take 1 or more sticks from a single row. Whoever takes the last stick loses. 30 seconds per turn.",bot:"🤖 Vs bot",pvp:"👥 Two players",easy:"Easy",mid:"Medium",hard:"Hard",take:"Take",again:"New game",card:"Your lobby card",player:"Player",shopSk:"Stick shop",shopUi:"Interface shop",my:"Your turn",p1:"Turn: Player 1",p2:"Turn: Player 2",pl1:"Player 1",pl2:"Player 2",think:"Bot is thinking…",sel:"Selected",pick:"Select",buy:"Buy for {N} 🪙",wins:"Wins",losses:"Losses",lose:"You took the last stick — you lose. +2 🪙",win:"Bot took the last stick — you win! +{N} 🪙",pvpEnd:"{L} took the last stick and lost. {W} wins!",sec:"s",sk_wood:"Wood",sk_bamboo:"Bamboo",sk_neon:"Neon",sk_gold:"Gold",ui_light:"Light",ui_dark:"Dark",ui_sunset:"Sunset",ui_neon:"Neon"}
};
const SK=[["wood",0],["bamboo",30],["neon",60],["gold",120]];
const UI=[["light",0],["dark",40],["sunset",70],["neon",100]];
let S={coins:0,wins:0,losses:0,own:["sk:wood","ui:light"],sk:"wood",ui:"light",lang:null};
try{const r=localStorage.getItem("lasttick");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.lang){const n=(navigator.language||"en").slice(0,2);S.lang=n==="ru"?"ru":n==="uz"?"uz":"en"}
const save=()=>{try{localStorage.setItem("lasttick",JSON.stringify(S))}catch(e){}};
const t=(k,o)=>{let s=L[S.lang][k];if(o)for(const x in o)s=s.replace("{"+x+"}",o[x]);return s};
const $=id=>document.getElementById(id);
let rows,sel,turn,over,mode="bot",lvl="mid",tl=30,tm=null,msgFn=()=>"";
const can=()=>!over&&(mode==="pvp"||turn==="me");
const msg=f=>{msgFn=f;$("msg").textContent=f()};
const turnMsg=()=>mode==="pvp"?t(turn==="me"?"p1":"p2"):t("my");

function stopT(){clearInterval(tm);tm=null;$("timer").textContent=""}
function showT(){const e=$("timer");e.textContent="⏱ "+tl+" "+t("sec");e.className="msg"+(tl<=10?" low":"")}
function startT(){clearInterval(tm);tl=30;showT();tm=setInterval(()=>{tl--;showT();if(tl<=0){clearInterval(tm);timeout()}},1000)}
function timeout(){
  if(over)return;
  let r=sel.r,n=sel.n;
  if(r<0){const ne=rows.map((x,i)=>x>0?i:-1).filter(i=>i>=0);r=ne[Math.floor(Math.random()*ne.length)];n=1+Math.floor(Math.random()*rows[r])}
  move(turn,r,n);
}
function seg(el,items,cur,fn){
  el.innerHTML="";
  items.forEach(([k,label])=>{const b=document.createElement("button");b.textContent=label;b.className=cur===k?"on":"";b.onclick=()=>fn(k);el.appendChild(b)});
}
function ctl(){
  seg($("langs"),[["ru","RU"],["uz","UZ"],["en","EN"]],S.lang,k=>{S.lang=k;save();draw()});
  seg($("modes"),[["bot",t("bot")],["pvp",t("pvp")]],mode,k=>{mode=k;start()});
  seg($("lvls"),[["easy",t("easy")],["mid",t("mid")],["hard",t("hard")]],lvl,k=>{lvl=k;start()});
  $("lvls").style.display=mode==="bot"?"flex":"none";
}

function start(){rows=[1,2,3,4,5];sel={r:-1,n:0};turn="me";over=false;msg(turnMsg);draw();startT()}
function draw(){
  document.body.dataset.ui=S.ui;document.body.dataset.sk=S.sk;document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  $("coins").textContent="🪙 "+S.coins;ctl();
  $("msg").textContent=msgFn();
  $("pstat").textContent=t("wins")+": "+S.wins+" · "+t("losses")+": "+S.losses;
  const b=$("board");b.innerHTML="";
  rows.forEach((n,i)=>{
    const d=document.createElement("div");d.className="row"+(sel.r===i?" sel":"");
    for(let k=0;k<n;k++){
      const s=document.createElement("div");s.className="stick"+(sel.r===i&&k>=n-sel.n?" pick":"");
      s.onclick=e=>{e.stopPropagation();if(!can())return;pick(i,n-k)};
      d.appendChild(s);
    }
    d.onclick=()=>{if(can()&&n>0)pick(i,sel.r===i?Math.min(sel.n+1,n):1)};
    b.appendChild(d);
  });
  $("take").disabled=!can()||sel.r<0;
  shop();
}
function pick(i,n){sel={r:i,n:n};draw()}
function total(){return rows.reduce((a,b)=>a+b,0)}
function finish(loserIsMe){
  over=true;stopT();
  if(mode==="pvp"){
    const l=t(loserIsMe?"pl1":"pl2"),w=t(loserIsMe?"pl2":"pl1");
    msg(()=>t("pvpEnd",{L:l,W:w}));draw();return;
  }
  if(loserIsMe){S.losses++;S.coins+=2;msg(()=>t("lose"))}
  else{const g={easy:5,mid:10,hard:20}[lvl];S.wins++;S.coins+=g;msg(()=>t("win",{N:g}))}
  save();draw();
}
function move(who,r,n){
  rows[r]-=n;sel={r:-1,n:0};
  if(total()===0){draw();finish(who==="me");return}
  turn=who==="me"?"bot":"me";draw();
  if(turn==="bot"&&mode==="bot"){msg(()=>t("think"));stopT();setTimeout(bot,700)}
  else{msg(turnMsg);startT()}
}
$("take").onclick=()=>{if(sel.r>=0&&sel.n>0)move(turn,sel.r,sel.n)};
$("again").onclick=start;

function bot(){
  const big=rows.map((n,i)=>n>1?i:-1).filter(i=>i>=0);
  let r,n;
  const rnd=()=>{const ne=rows.map((x,i)=>x>0?i:-1).filter(i=>i>=0);r=ne[Math.floor(Math.random()*ne.length)];n=1+Math.floor(Math.random()*rows[r])};
  if(Math.random()<({easy:0.65,mid:0.3,hard:0})[lvl]){rnd()}
  else if(big.length===0){r=rows.findIndex(x=>x>0);n=1}
  else if(big.length===1){
    r=big[0];const ones=rows.filter(x=>x===1).length;
    n=ones%2===0?rows[r]-1:rows[r];
  }else{
    const x=rows.reduce((a,b)=>a^b,0);
    if(x===0)rnd();
    else{r=rows.findIndex(h=>(h^x)<h);n=rows[r]-(rows[r]^x)}
  }
  move("bot",r,n);
}

function shop(){
  const mk=(el,list,pre,key)=>{
    el.innerHTML="";
    list.forEach(([id,price])=>{
      const k=pre+":"+id,owned=S.own.includes(k),on=S[key]===id;
      const d=document.createElement("div");d.className="item"+(on?" on":"");
      const b=document.createElement("button");
      b.textContent=on?t("sel"):owned?t("pick"):t("buy",{N:price});
      b.disabled=on||(!owned&&S.coins<price);
      b.onclick=()=>{if(!owned){S.coins-=price;S.own.push(k)}S[key]=id;save();draw()};
      d.innerHTML="<b>"+t(pre+"_"+id)+"</b>";d.appendChild(b);el.appendChild(d);
    });
  };
  mk($("shopSk"),SK,"sk","sk");mk($("shopUi"),UI,"ui","ui");
}
start();
</script>
</body>
</html>
